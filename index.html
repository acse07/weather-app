<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <div class="app" id="app" data-theme="light" data-weather-bg="default">
    <header class="topbar">
      <h1 class="app-title">Weather</h1>
      <div class="topbar-actions">
        <button id="units-toggle" class="icon-btn" type="button" aria-label="Toggle units">
          <span id="units-label">°C</span>
        </button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light and dark theme">
          <span id="theme-icon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </header>

    <section class="search-panel card">
      <form id="search-form" class="search-form" novalidate>
        <div class="search-input-wrap">
          <input
            id="city-input"
            type="text"
            placeholder="Search city"
            autocomplete="off"
            aria-label="Search city"
          >
          <button id="clear-input" class="clear-btn hidden" type="button" aria-label="Clear input">×</button>
        </div>
        <button id="search-btn" class="btn" type="submit">Search</button>
        <button id="geo-btn" class="btn btn-secondary" type="button" aria-label="Use my location">Use location</button>
      </form>
      <p id="input-hint" class="hint hidden" role="status"></p>

      <div class="history-wrap">
        <h2 class="section-title">Recent</h2>
        <div id="history-list" class="history-list"></div>
      </div>
    </section>

    <main id="content" class="content">
      <section id="empty-state" class="empty-state card">
        <div class="cloud-illustration" aria-hidden="true">
          <div class="cloud"></div>
          <div class="sun"></div>
        </div>
        <h2>Search for a city to see the weather</h2>
        <p>Get current conditions, hourly changes, and a 5-day outlook.</p>
        <div id="quick-cities" class="quick-cities">
          <button class="chip" type="button" data-city="London">London</button>
          <button class="chip" type="button" data-city="New York">New York</button>
          <button class="chip" type="button" data-city="Tokyo">Tokyo</button>
          <button class="chip" type="button" data-city="Sydney">Sydney</button>
        </div>
      </section>

      <p id="global-error" class="error hidden card" role="status"></p>

      <section id="weather-layout" class="weather-layout hidden" aria-live="polite">
        <article id="current-card" class="card current-card"></article>
        <article id="hourly-card" class="card hourly-card"></article>
        <article id="daily-card" class="card daily-card"></article>
      </section>
    </main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
